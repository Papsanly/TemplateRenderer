<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WeFly Gift Card - Back</title>
  {# Back of the 1500x600 gift card: logo and contacts on the pass gradient. Needs no context. #}
  <style>
    {% include "partials/wefly_gift.css" %}

    @page { size: 1500px 600px; margin: 0; }

    html, body { width: 1500px; height: 600px; overflow: hidden; background: #fff; }

    .card { position: relative; width: 1500px; height: 600px; overflow: hidden; background: #fff; }
    .card__scale { width: 723px; height: 289.2px; transform: scale(2.074689); transform-origin: 0 0; }

    .back {
      position: relative; width: 723px; height: 289.2px; box-sizing: border-box; overflow: hidden;
      border-radius: 24px; background: linear-gradient(to right, #306bc9, #2258b5); color: #fff;
      padding: 28px 30px 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    }
    .back__art { position: absolute; left: 50%; top: -20px; width: 620px; margin-left: -310px; opacity: .1; }
    .back__logo { position: relative; display: block; height: 132px; width: auto; margin-top: 18px; }
    .back__contacts {
      position: relative; display: flex; align-items: center; gap: 12px;
      font-size: 10.5px; font-weight: 500; letter-spacing: .04em; color: rgba(255,255,255,.8); white-space: nowrap;
    }
    .back__contacts i { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.5); }
  </style>
</head>
<body>
<div class="card">
  <div class="card__scale">
    <div class="back">
      <img class="back__art" src="images/plane-outline-white.svg" alt="">
      <img class="back__logo" src="images/AlternativeLogo-white.svg" alt="WeFly">
      <div class="back__contacts">
        <span>1 W Mountain St, Unit 9, Pasadena, CA 91103</span><i></i>
        <span>+1 (844) 966-4865</span><i></i>
        <span>wefly.aero</span><i></i>
        <span>@weflyaero</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
